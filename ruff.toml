# Ruff configuration: linting and formatting of the Python code. Rules are
# listed explicitly, so that upgrading Ruff never enables new ones silently.

target-version = "py312"
line-length = 79

[lint]
select = [
    # Errors, warnings and Pyflakes, as in Ruff's former defaults.
    "E4", "E7", "E9", "F", "W",
    # Imports, docstrings and pandas.
    "I", "TID", "D", "PD",
    # Docstring parameters, returns and raises (pydoclint, preview rules).
    "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
    # Likely bugs, security, and modern, simpler and faster code.
    "A", "ARG", "B", "BLE", "C4", "C90", "DTZ", "ERA", "FURB", "ICN", "ISC",
    "N", "NPY", "PERF", "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "T20",
    "TRY", "UP",
]
ignore = [
    # Counts of returns, branches, arguments and statements: C90 limits the
    # complexity of functions instead.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    # Literal numbers such as years and hours of the year.
    "PLR2004",
    # Named return values, which match the NumPy-style docstrings.
    "RET504",
    # Exception messages written where the exception is raised.
    "TRY003",
    # Temporary: existing findings, fixed in a follow-up pull request.
    "A001", "B905", "C901", "DOC102", "DTZ002", "DTZ005", "DTZ007", "N803",
    "N806", "PLC0206", "PLR1704", "RUF001", "RUF002", "RUF003", "S113",
    "S310",
]
explicit-preview-rules = true
preview = true
pydocstyle.convention = "numpy"
pycodestyle.max-doc-length = 72
pep8-naming.extend-ignore-names = ["X", "X_*"]

[lint.per-file-ignores]
"demandcast/tests/**" = [
    "S101",
    # Temporary: existing findings, fixed in a follow-up pull request.
    "NPY002", "PT011", "PT012", "SIM117",
]
# Legacy notebooks and scripts keep the original rules.
"demandcast/archive/**" = [
    "A", "ARG", "B", "BLE", "C4", "C90", "DTZ", "ERA", "FURB", "ICN", "ISC",
    "N", "NPY", "PERF", "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "T20",
    "TRY", "UP",
]

[format]
docstring-code-format = true

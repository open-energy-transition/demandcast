# The composites of Colombia: its non-standard subdivisions that are
# unions of standard subdivisions of Natural Earth at 1:10m, by their
# ISO 3166-2 codes, without the parts of some of them that the polygons
# of `cuts` mark, in WKT, in degrees of longitude and latitude,
# simplified and rounded to 0.1 degrees.

cuts:
  choco:
    description: "The municipalities of Chocó, Colombia, whose seats are off
      the SIN: Acandí, Unguía, Juradó, Bahía Solano, Nuquí, Alto and Bajo Baudó,
      Litoral del San Juan, Bojayá and Medio Atrato."
    polygon: >-
      MULTIPOLYGON (((-76.1 6.4, -76 6.2, -76 6.1, -76.2 6, -76.2 6.2, -76.8
      5.8, -77 6.1, -76.7 6.1, -76.7 6.2, -76.8 6.4, -76.9 6.3, -77.1 6.3,
      -77.2 6, -77 5.7, -77 5.5, -76.9 5.4, -77.1 5.2, -77.3 5, -77.1 5, -77.1
      4.9, -77 4.9, -77 4.8, -77.2 4.5, -76.6 4.3, -76.3 4.5, -76.2 4.3, -76.2
      4.1, -76.5 3.7, -77.2 3.9, -77.5 3.8, -77.7 4, -77.8 4.2, -77.6 4.6,
      -77.6 5.3, -77.8 5.5, -77.6 5.8, -77.7 6.1, -77.7 6.4, -77.9 6.7, -78.1
      7.2, -78 7.6, -77.8 7.7, -77.6 6.7, -77.4 6.8, -76.8 6.8, -76.8 7, -76.7
      7, -76.5 6.4, -76.1 6.4)), ((-77.5 7.6, -77.6 7.5, -77.7 7.7, -77.5
      7.6)), ((-76.9 7.6, -77.1 7.8, -77.1 7.9, -77.3 7.9, -77.4 7.8, -77.4
      7.9, -77.7 8.5, -77.5 8.9, -77.2 8.9, -76.8 8.4, -76.7 8.1, -76.9 7.6)))
  guaviare:
    description: Miraflores, in Guaviare, Colombia, whose seat is off the SIN.
    polygon: >-
      POLYGON ((-72.9 1, -72.8 1.1, -72.7 1.1, -72.6 1.4, -72.4 1.4, -72.3 1.5,
      -72.4 1.8, -72 2, -71.3 1.6, -71.1 1.7, -71.3 0.9, -71.9 0.4, -72.2 0.5,
      -72.9 1))
  meta:

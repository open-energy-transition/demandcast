    polygon: >-
      POLYGON ((-70.8 3.4, -70.8 2.8, -71 2.6, -72.5 2.5, -72.6 2.5, -72.7 2.6,
      -72.6 2.6, -72.4 2.8, -72.8 3, -72.9 2.9, -72.9 3.2, -72.4 3.4, -72.2
      3.3, -71.6 3.5, -71.2 3.4, -71.1 3.3, -71 3.7, -70.8 3.4))
  putumayo:
    description: Puerto Leguízamo, in Putumayo, Colombia, whose seat is off the
      SIN.
    polygon: >-
      POLYGON ((-76.3 0.4, -76.2 0.4, -75.4 0.5, -75.2 0.7, -75.5 0.8, -75.2 1,
      -74.7 0.5, -74.5 0.4, -74.4 0.2, -73.7 -0.2, -73.6 -0.5, -73.7 -0.6,

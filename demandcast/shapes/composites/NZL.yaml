# The composites of New Zealand: its non-standard subdivisions that are
# unions of standard subdivisions of Natural Earth at 1:10m, by their
# ISO 3166-2 codes, without the parts of some of them that the polygons
# of `cuts` mark, in WKT, in degrees of longitude and latitude,
# simplified and rounded to 0.1 degrees.

composites:
  NZL_NI:
    name: North Island
    regions: NZ-AUK NZ-BOP NZ-GIS NZ-HKB NZ-MWT NZ-NTL NZ-TKI NZ-WGN NZ-WKO
  NZL_SI:
    name: South Island
    regions: NZ-CAN NZ-MBH NZ-NSN NZ-OTA NZ-STL NZ-TAS NZ-WTC

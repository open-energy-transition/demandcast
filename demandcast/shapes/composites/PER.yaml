# The composites of Peru: its non-standard subdivisions that are unions
# of standard subdivisions of Natural Earth at 1:10m, by their ISO
# 3166-2 codes, without the parts of some of them that the polygons of
# `cuts` mark, in WKT, in degrees of longitude and latitude, simplified
# and rounded to 0.1 degrees.

cuts:
  loreto:
    description: Loreto, Peru, outside Alto Amazonas, its province on the SEIN.
    polygon: >-
      POLYGON ((-79 1, -69 1, -69 -10, -79 -10, -79 1), (-76.8 -6, -76.4 -6,
      -76.1 -6.2, -75.7 -6.2, -75.5 -5.9, -75.4 -5.6, -75.6 -5.5, -75.6 -5.4,
      -75.6 -5.2, -75.4 -5, -75.7 -4.9, -75.8 -4.7, -75.8 -4.4, -76 -4.3, -76.1
      -4, -76.3 -3.7, -76.4 -3.9, -76.2 -4.3, -76.4 -4.4, -76.2 -4.8, -75.8 -5,
      -76 -5.1, -76.5 -5, -76.7 -5.4, -76.9 -5.5, -76.9 -5.7, -76.8 -6))
  ucayali:
    description: Atalaya and Purús, in Ucayali, Peru, isolated from the SEIN.
    polygon: >-
      POLYGON ((-74.8 -11.1, -74.9 -10.9, -74.8 -10.7, -74.5 -10.5, -74.7 -10,
      -74.5 -9.6, -74.4 -10, -74.1 -9.7, -73.7 -9.5, -73.2 -10.1, -73 -10,

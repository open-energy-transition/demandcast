      -71.2 -11.2, -71.9 -11.3, -72.1 -11.6, -72.5 -11.7, -73.1 -11.6, -73.4
      -11.7, -73.8 -11.5, -74.5 -11.3, -74.8 -11.1))

composites:
  PER_SEIN:
    name: National Interconnected System
    regions: >-
      PE-AMA PE-ANC PE-APU PE-ARE PE-AYA PE-CAJ PE-CAL PE-CUS PE-HUC PE-HUV

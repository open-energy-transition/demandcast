# The non-standard subdivisions of Canada defined by the standard
# subdivisions of Natural Earth at 1:10m that make them, by their ISO
# 3166-2 codes, without the parts of some of them that the polygons of
# `cuts` mark, in WKT, in degrees of longitude and latitude, simplified
# and rounded to 0.1 degrees.

cuts:
  labrador:
    description: Labrador, in Newfoundland and Labrador, Canada, outside the
      Island Interconnected System.
    polygon: >-
      POLYGON ((-68 61, -55 61, -55 51.2, -55.6 51.2, -55.4 51.3, -55.3 51.6,
      -55.9 51.7, -56.7 51.4, -56.9 51.2, -68 51.2, -68 61))
  quebec:
    description: "The parts of Québec, Canada, that the off-grid networks of
      Hydro-Québec serve: Nunavik, north of the 55th parallel, the
      Basse-Côte-Nord, east of Natashquan, Anticosti and the
      Îles-de-la-Madeleine."
    polygon: >-
      MULTIPOLYGON (((-55 63.5, -55 55, -80 55, -80 63.5, -55 63.5)), ((-56.5
      52.3, -56.5 49.9, -61.6 49.9, -61.6 52.3, -56.5 52.3)), ((-61.8 47.2,
      -62.1 47.2, -62 47.5, -61.6 47.7, -61.3 47.7, -61.4 47.6, -61.6 47.5,
      -61.8 47.3, -61.8 47.2)), ((-64.5 49.9, -64.2 50, -63.1 49.8, -61.9 49.4,
      -61.6 49.1, -61.8 49, -62.3 49, -63.1 49.2, -63.6 49.3, -63.7 49.5, -63.9
      49.6, -64.5 49.8, -64.5 49.9)))
  yukon:
    description: "The parts of Yukon, Canada, that off-grid systems serve:
      Watson Lake and the south-east, Old Crow and the north, and Beaver Creek
      and Burwash Landing in the west."
    polygon: >-
      MULTIPOLYGON (((-129.5 62.2, -123 62.2, -123 59.9, -130.8 59.9, -130.8
      61.2, -129.5 62.2)), ((-130 70, -130 65.5, -142 65.5, -142 70, -130 70)),
      ((-138.4 63.2, -138.4 60.9, -141.5 60.9, -141.5 63.2, -138.4 63.2)))

subdivisions:
  CAN_NL-ISLAND:
    name: Island Interconnected System
    standard_subdivisions: CA-NL
    cuts:
      CA-NL: labrador
  CAN_QC-INTEGRATED:
    name: Integrated network of Québec
    standard_subdivisions: CA-QC
    cuts:
      CA-QC: quebec
  CAN_YT-INTEGRATED:
    name: Yukon Integrated System
    standard_subdivisions: CA-YT
    cuts:
      CA-YT: yukon

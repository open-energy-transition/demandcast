# The non-standard subdivisions of Russia defined by the standard
# subdivisions of Natural Earth at 1:10m that make them, by their ISO
# 3166-2 codes, without the parts of some of them that the polygons of
# `cuts` mark, in WKT, in degrees of longitude and latitude, simplified
# and rounded to 0.1 degrees.

cuts:
  taimyr:
    description: Taimyr and Norilsk, an isolated power system in Krasnoyarsk
      Krai, Russia.
    polygon: >-
      POLYGON ((67.7 68.4, 82.7 68.4, 84.8 67.2, 85.7 68, 86.4 68.1, 87.5 67.3,
      90.6 67.4, 93 68.4, 94.2 68.4, 95.4 69.3, 98 69.8, 99.7 69.9, 103.8 69.3,
      106.4 69.5, 131.4 69.5, 131.4 82, 67.7 82, 67.7 68.4))
  yakutia:
    description: The 13 Arctic districts of Yakutia, Russia, outside the
      western, central and south Yakutian energy districts of the East.
    polygon: >-
      POLYGON ((91.3 66.5, 106.3 66.5, 108 66.4, 108.8 66.8, 109.5 66.1, 112.7
      66.6, 113.5 65.9, 112.3 65.6, 112.8 65.5, 112.6 65.1, 114.1 64.6, 117.2
      65.3, 118.3 66.1, 118.1 66.4, 119.2 66.7, 119 66.9, 120.3 66.5, 120.5
      65.7, 121.2 65.3, 123.4 64.7, 127 65.6, 127.6 66, 126.9 66.2, 127.3 66.6,
      128.5 66.7, 130 66.5, 130.1 66.2, 131.7 65.7, 131.5 65.5, 132.4 64.6,
      132.8 64.6, 133.2 65.3, 136.8 66.2, 144.2 65, 146.4 64.2, 171.4 64.2,
      171.4 82, 91.3 82, 91.3 66.5))


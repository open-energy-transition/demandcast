# The non-standard subdivisions of the Philippines defined by the
# standard subdivisions of Natural Earth at 1:10m that make them, by
# their ISO 3166-2 codes, without the parts of some of them that the
# polygons of `cuts` mark, in WKT, in degrees of longitude and latitude,
# simplified and rounded to 0.1 degrees.

subdivisions:
  PHL_BOHOL:
    name: Bohol
    standard_subdivisions: PH-BOH
  PHL_CEBU:
    name: Cebu
    standard_subdivisions: PH-CEB PH-LAP PH-MDE
  PHL_LEYTE-SAMAR:
    name: Leyte-Samar
    standard_subdivisions: PH-BIL PH-EAS PH-LEY PH-NSA PH-SLE PH-WSA
  PHL_LUZON:
    name: Luzon
    standard_subdivisions: >-
      PH-ABR PH-ALB PH-APA PH-AUR PH-BAN PH-BEN PH-BTG PH-BUL PH-CAG PH-CAN
      PH-CAS PH-CAV PH-IFU PH-ILN PH-ILS PH-ISA PH-KAL PH-LAG PH-LUN PH-MNL
      PH-MOU PH-NUE PH-NUV PH-PAM PH-PAN PH-QUE PH-QUI PH-RIZ PH-SOR PH-TAR
      PH-ZMB
  PHL_MINDANAO:
    name: Mindanao
    standard_subdivisions: >-
      PH-AGN PH-AGS PH-BUK PH-CAM PH-COM PH-DAO PH-DAS PH-DAV PH-LAN PH-LAS
      PH-MAG PH-MSC PH-MSR PH-NCO PH-SAR PH-SCO PH-SUK PH-SUN PH-SUR PH-ZAN
      PH-ZAS PH-ZSI
  PHL_NEGROS:
    name: Negros
    standard_subdivisions: PH-BCD PH-NEC PH-NER
  PHL_PANAY:
    name: Panay
    standard_subdivisions: PH-AKL PH-ANT PH-CAP PH-GUI PH-ILI
  PHL_VISAYAS:
    name: Visayas
    standard_subdivisions: >-
      PH-AKL PH-ANT PH-BCD PH-BIL PH-BOH PH-CAP PH-CEB PH-EAS PH-GUI PH-ILI
      PH-LAP PH-LEY PH-MDE PH-NEC PH-NER PH-NSA PH-SLE PH-WSA

# The non-standard subdivisions of Spain defined by the standard
# subdivisions of Natural Earth at 1:10m that make them, by their ISO
# 3166-2 codes, without the parts of some of them that the polygons of
# `cuts` mark, in WKT, in degrees of longitude and latitude, simplified
# and rounded to 0.1 degrees.

subdivisions:
  ESP_PENINSULAR:
    name: Peninsular Spain
    standard_subdivisions: >-
      ES-A ES-AB ES-AL ES-AV ES-B ES-BA ES-BI ES-BU ES-C ES-CA ES-CC ES-CO
      ES-CR ES-CS ES-CU ES-GI ES-GR ES-GU ES-H ES-HU ES-J ES-L ES-LE ES-LO
      ES-LU ES-M ES-MA ES-MU ES-NA ES-O ES-OR ES-P ES-PO ES-S ES-SA ES-SE ES-SG
      ES-SO ES-SS ES-T ES-TE ES-TO ES-V ES-VA ES-VI ES-Z ES-ZA

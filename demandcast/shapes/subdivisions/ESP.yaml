# The non-standard subdivisions of Spain defined by the standard
# subdivisions of Natural Earth at 1:10m that make them, by their ISO
# 3166-2 codes, without the parts of some of them that the polygons of
# `cuts` mark, in WKT, in degrees of longitude and latitude, simplified
# and rounded to 0.01 degrees.

cuts:
  balearic_islands_outside_formentera:
    description: Mallorca, Menorca and Ibiza, the islands of the Balearic
      Islands, Spain, other than Formentera.
    polygon: >-
      MULTIPOLYGON (((3.7 39.7, 3.7 40.15, 4.4 40.15, 4.4 39.7, 3.7 39.7)),
      ((2.2 39.05, 2.2 40.05, 3.55 40.05, 3.55 39.05, 2.2 39.05)), ((1.1 38.79,
      1.1 39.2, 1.7 39.2, 1.7 38.79, 1.1 38.79)))
  balearic_islands_outside_ibiza:
    description: Mallorca, Menorca and Formentera, the islands of the Balearic
      Islands, Spain, other than Ibiza.
    polygon: >-
      MULTIPOLYGON (((3.7 39.7, 3.7 40.15, 4.4 40.15, 4.4 39.7, 3.7 39.7)),
      ((2.2 39.05, 2.2 40.05, 3.55 40.05, 3.55 39.05, 2.2 39.05)), ((1.3 38.6,
      1.3 38.79, 1.65 38.79, 1.65 38.6, 1.3 38.6)))
  balearic_islands_outside_mallorca:
    description: Menorca, Ibiza and Formentera, the islands of the Balearic
      Islands, Spain, other than Mallorca.
    polygon: >-
      MULTIPOLYGON (((1.1 38.79, 1.1 39.2, 1.7 39.2, 1.7 38.79, 1.65 38.79,
      1.65 38.6, 1.3 38.6, 1.3 38.79, 1.1 38.79)), ((3.7 39.7, 3.7 40.15, 4.4
      40.15, 4.4 39.7, 3.7 39.7)))
  balearic_islands_outside_menorca:
    description: Mallorca, Ibiza and Formentera, the islands of the Balearic
      Islands, Spain, other than Menorca.
    polygon: >-
      MULTIPOLYGON (((1.1 38.79, 1.1 39.2, 1.7 39.2, 1.7 38.79, 1.65 38.79,
      1.65 38.6, 1.3 38.6, 1.3 38.79, 1.1 38.79)), ((2.2 39.05, 2.2 40.05, 3.55
      40.05, 3.55 39.05, 2.2 39.05)))
  las_palmas_outside_fuerteventura:
    description: Gran Canaria and Lanzarote, the islands of the province of Las
      Palmas, Spain, other than Fuerteventura.
    polygon: >-
      MULTIPOLYGON (((-13.95 28.8, -13.95 29.5, -13.3 29.5, -13.3 28.8, -13.95
      28.8)), ((-15.9 27.7, -15.9 28.2, -15.3 28.2, -15.3 27.7, -15.9 27.7)))
  las_palmas_outside_gran_canaria:
    description: Lanzarote and Fuerteventura, the islands of the province of
      Las Palmas, Spain, other than Gran Canaria.
    polygon: >-
      POLYGON ((-14.6 27.95, -14.6 28.8, -13.95 28.8, -13.95 29.5, -13.3 29.5,
      -13.3 28.8, -13.75 28.8, -13.75 27.95, -14.6 27.95))
  las_palmas_outside_lanzarote:
    description: Gran Canaria and Fuerteventura, the islands of the province of
      Las Palmas, Spain, other than Lanzarote.
    polygon: >-
      MULTIPOLYGON (((-14.6 27.95, -14.6 28.8, -13.75 28.8, -13.75 27.95, -14.6
      27.95)), ((-15.9 27.7, -15.9 28.2, -15.3 28.2, -15.3 27.7, -15.9 27.7)))
  santa_cruz_de_tenerife_outside_el_hierro:
    description: Tenerife, La Palma and La Gomera, the islands of the province
      of Santa Cruz de Tenerife, Spain, other than El Hierro.
    polygon: >-
      MULTIPOLYGON (((-16.95 27.95, -16.95 28.65, -16.05 28.65, -16.05 27.95,
      -16.95 27.95)), ((-17.4 27.95, -17.4 28.25, -17.05 28.25, -17.05 27.95,
      -17.4 27.95)), ((-18.05 28.4, -18.05 28.9, -17.65 28.9, -17.65 28.4,
      -18.05 28.4)))
  santa_cruz_de_tenerife_outside_la_gomera:
    description: Tenerife, La Palma and El Hierro, the islands of the province
      of Santa Cruz de Tenerife, Spain, other than La Gomera.
    polygon: >-
      MULTIPOLYGON (((-16.95 27.95, -16.95 28.65, -16.05 28.65, -16.05 27.95,
      -16.95 27.95)), ((-18.05 28.4, -18.05 28.9, -17.65 28.9, -17.65 28.4,
      -18.05 28.4)), ((-18.2 27.6, -18.2 27.9, -17.85 27.9, -17.85 27.6, -18.2
      27.6)))
  santa_cruz_de_tenerife_outside_la_palma:
    description: Tenerife, La Gomera and El Hierro, the islands of the province
      of Santa Cruz de Tenerife, Spain, other than La Palma.
    polygon: >-
      MULTIPOLYGON (((-16.95 27.95, -16.95 28.65, -16.05 28.65, -16.05 27.95,
      -16.95 27.95)), ((-17.4 27.95, -17.4 28.25, -17.05 28.25, -17.05 27.95,
      -17.4 27.95)), ((-18.2 27.6, -18.2 27.9, -17.85 27.9, -17.85 27.6, -18.2
      27.6)))
  santa_cruz_de_tenerife_outside_tenerife:
    description: La Palma, La Gomera and El Hierro, the islands of the province
      of Santa Cruz de Tenerife, Spain, other than Tenerife.
    polygon: >-
      MULTIPOLYGON (((-17.4 27.95, -17.4 28.25, -17.05 28.25, -17.05 27.95,
      -17.4 27.95)), ((-18.05 28.4, -18.05 28.9, -17.65 28.9, -17.65 28.4,
      -18.05 28.4)), ((-18.2 27.6, -18.2 27.9, -17.85 27.9, -17.85 27.6, -18.2
      27.6)))


# The non-standard subdivisions of Chile defined by the standard
# subdivisions of Natural Earth at 1:10m that make them, by their ISO
# 3166-2 codes, without the parts of some of them that the polygons of
# `cuts` mark, in WKT, in degrees of longitude and latitude, simplified
# and rounded to 0.1 degrees.

cuts:
  antofagasta:
    description: Antofagasta, Chile, but Taltal, its commune in the central
      system.
    polygon: >-
      POLYGON ((-70.6 -24.5, -70.4 -24.6, -69.2 -24.7, -69.1 -24.9, -69.2
      -25.2, -69 -25.4, -69 -26.5, -66 -26.5, -66 -17, -72 -17, -72 -24.5,
      -70.6 -24.5))
  los_lagos:
    description: "The communes of Los Lagos, Chile, with medium systems of
      their own: Cochamó, Hualaihué, Chaitén, Futaleufú and Palena."
    polygon: >-
      POLYGON ((-72.6 -41.7, -72.4 -41.5, -72.4 -41.4, -72.3 -41.5, -70 -41.5,
      -70 -45, -73.2 -45, -73.2 -41.7, -72.6 -41.7))

subdivisions:
  CHL_SEN:
    name: National Electric System
    standard_subdivisions: >-
      CL-AN CL-AP CL-AR CL-AT CL-BI CL-CO CL-LI CL-LL CL-LR CL-ML CL-NB CL-RM
      CL-TA CL-VS
    cuts:
      CL-LL: los_lagos
  CHL_SIC:
    name: Central Interconnected System
    standard_subdivisions: >-
      CL-AN CL-AR CL-AT CL-BI CL-CO CL-LI CL-LL CL-LR CL-ML CL-NB CL-RM CL-VS
    cuts:
      CL-AN: antofagasta
      CL-LL: los_lagos

# Configuration read by the retrieve.py script.

# REQUIRED.
# The type of data to be retrieved. Supported types are:
# - electricity_demand,
# - gridded_gdp_ppp,
# - gridded_population,
# - population,
# - annual_electricity_demand_per_capita,
# - gridded_weather,

# - gdp_ppp_per_capita,
# - temperature.
variable: electricity_demand


# OPTIONAL - REQUIRED for electricity_demand variable.
# The acronym of the data source as defined in the retrieval
# modules (example: "entsoe").
electricity_data_source: "ngcp"

# OPTIONAL.
# The ISO Alpha-3 code (example: "FRA") or a combination of ISO
# Alpha-3 code and subdivision code (example: "USA_CAL").
code: 

# OPTIONAL.
# The path to the yaml file containing the list of codes of the
# countries and subdivisions of interest."
file: "D:/Modelling/demandcast/demandcast/config/target_subnationals_config.yaml"

# OPTIONAL.
# The year of the data to be retrieved.
year: 

# OPTIONAL.
# Start year for a range of years of data to be retrieved.
start_year: 2000

# OPTIONAL.
# End year for a range of years of data to be retrieved.
end_year: 2024

# OPTIONAL.
# Scenario of the data to be retrieved.
# Specify for future years, or else it will download all the available scenarios
# it is painful to run everything
scenario: #SSP2-4.5
#Scenario SPP1-2.6 is the sustainability pathway, but less aggressive than SSP1-1.9. Setting this as default scenario
#Scenario SSP1-26 for annual_electricity_demand_per_capita
#Scenario SSP1 for population, gdp/ppp per capita
#Scenario SSP1-2.6 for gridded_weather
#Details about the scenarios: https://www.climatehubs.usda.gov/hubs/northwest/topic/what-are-climate-model-phases-and-scenarios#:~:text=How%20do%20shared%20socioeconomic%20pathways,Description

# OPTIONAL.
# Variable of the weather data to be retrieved (only "temperature" is
# currently supported).
weather_variable: #temperature

# OPTIONAL.
# The climate model for the weather data to be retrieved.
# For temperature, it is recommended to specify the climate model, or else the processing time is painful
climate_model: #CNRM-ESM2-1

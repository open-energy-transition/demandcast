# Configuration of the machine learning model, read by the train.py,
# validate.py, cross_validate.py and forecast.py scripts. The data is
# grouped by its "Entity code", split into sets by its "Local year" and
# ordered by its "Time (UTC)", the columns of the assembled data.

# REQUIRED.
# The machine learning algorithm to be used for training.
algorithm: XGBoost

# REQUIRED.
# The features used for training the model.
features:
  - "Local hour of the day"
  - "Local weekend indicator"
  - "Local holiday indicator"
  - "Local month of the year"
  - "Temperature - Top 1 (K)"
  - "Temperature - Top 3 (K)"
  - "Monthly average temperature - Top 1 (K)"
  - "Monthly average temperature rank - Top 1"
  - "Annual average temperature - Top 1 (K)"
  - "5 percentile temperature - Top 1 (K)"
  - "95 percentile temperature - Top 1 (K)"
  - "GDP PPP per capita (2021 international $)"
  - "Annual electricity demand per capita (kWh)"

# REQUIRED.
# The target variable for the model, which the models learn as the load
# relative to the annual mean of its local year (see ml_models/data.py).
target: "Load (fraction of annual total)"

# OPTIONAL.
# The categorical features used for training the model.
categorical_features:
  - "Local hour of the day"
  - "Local weekend indicator"
  - "Local holiday indicator"
  - "Local month of the year"
  - "Monthly average temperature rank - Top 1"

# OPTIONAL, but needed by forecast.py.
# Variables to scale the predictions: their product is the annual
# demand that converts the predictions to MW.
scaling_variables:
  - "Annual electricity demand per capita (kWh)"
  - "Population"

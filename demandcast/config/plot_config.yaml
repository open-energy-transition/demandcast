# Configuration read by the plot.py script.

# REQUIRED.
# The figure to plot. Supported figures are:
# - data_availability,
# - map_of_available_entities,
# - ml_results,
# - status: the figures and numbers of the Current state page of the
#   documentation, also written into webpage/docs/status/ and the README.
figure: data_availability

# OPTIONAL - REQUIRED for ml_results figure.
# The version of the ML model whose results are to be plotted: the trained model
# of a validation (such as xgboost_model_20261029_144400) or the algorithm of a
# cross-validation (such as xgboost), whose latest results are read, or the name
# of the folder of MAPE files of an earlier version.
version:

# OPTIONAL.
# The version of the ML model whose results are to be considered in the comparison.
compare_with_version:

# OPTIONAL.
# Whether to plot the results by group (income level and continent).
by_group: false

# OPTIONAL - only for the ml_results figure.
# The results to plot: those of the validations ("validation") or of the
# cross-validations ("cross_validation") (default: validation).
results: validation

# OPTIONAL - only for the ml_results figure.
# The metric of the errors: the weighted absolute percentage error ("WAPE") or
# the mean absolute percentage error ("MAPE"), the only one of the results of
# earlier versions (default: WAPE).
metric: WAPE

# OPTIONAL - only for the status figures.
# The Parquet files of the results of the validation and of the cross-validation
# to publish on the Current state page, such as
# data/results/validation/with_<model>/using_<data>/all_<time>.parquet (default:
# the latest of each, by the time in their names).
validation_results:
cross_validation_results:

settings_folder: settings
figures_folder: figures
shapes_folder: shapes
checks_folder: checks
retrievals_folder: &retrievals_folder retrievals
electricity_demand_data_sources_folder:
  - *retrievals_folder
  - electricity_demand_data_sources
data_folder: &data_folder data
electricity_demand_folder:
  - *data_folder
  - electricity_demand
manually_downloaded_electricity_demand_folder:
  - *data_folder
  - electricity_demand
  - manual_downloads
annual_electricity_demand_per_capita_folder:
  - *data_folder
  - annual_electricity_demand_per_capita
population_folder:
  - *data_folder
  - population
gridded_population_folder:
  - *data_folder
  - gridded_population
gdp_ppp_per_capita_folder:
  - *data_folder
  - gdp_ppp_per_capita
gridded_gdp_ppp_folder:
  - *data_folder
  - gridded_gdp_ppp
gridded_weather_folder:
  - *data_folder
  - gridded_weather
temperature_folder:
  - *data_folder
  - temperature

# Configuration of the XGBoost model, read by ml_models/registry.py when
# the algorithm of ml_config.yaml is XGBoost.

# OPTIONAL.
# Random seed for reproducibility (default: 42).
random_state: 42

# OPTIONAL.
# Enable categorical feature support in XGBoost (default: true).
enable_categorical: true

# OPTIONAL.
# Evaluation metric of the validation set, which stops the training
# with early_stopping_rounds.
evaluation_metric: "mape"

# OPTIONAL.
# With a validation set (use_validation_set in train_config.yaml), stop
# adding trees once the evaluation metric of the validation set has not
# improved for this many rounds. Empty for no early stopping.
early_stopping_rounds:

# OPTIONAL.
# The hyperparameters of XGBoost, which keep its defaults when they are
# empty: the number of trees, their maximum depth, the learning rate,
# the fractions of the rows and of the features of each tree, the
# minimum weight of a leaf, and the L1 and L2 regularization.
n_estimators:
max_depth:
learning_rate:
subsample:
colsample_bytree:
min_child_weight:
reg_alpha:
reg_lambda:

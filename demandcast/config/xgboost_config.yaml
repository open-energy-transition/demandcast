# Configuration of the XGBoost model, read by ml_models/registry.py when
# the algorithm of ml_config.yaml is XGBoost.

# REQUIRED.
# Random seed for reproducibility.
random_state: 42

# REQUIRED.
# Enable categorical feature support in XGBoost.
enable_categorical: true

# REQUIRED.
# Evaluation metric for model training and validation.
evaluation_metric: "mape"

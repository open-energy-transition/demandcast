# The DemandCast Python project: its dependencies and the settings of
# mypy, pytest and coverage.

[project]
name = "demandcast"
version = "1.0.0"
description = "DemandCast"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "cartopy>=0.24.1",
    "cdsapi>=0.7.5",
    "countryinfo>=1.0.1",
    "cpi>=2.0.8",
    "dask>=2025.11.0",
    "entsoe-py>=0.6.18",
    "geopandas>=1.0.1",
    "google-cloud-storage>=3.1.0",
    "matplotlib>=3.10.0",
    "nepali-datetime>=1.0.8.4",
    "netcdf4>=1.7.3",
    "numpy>=2.2.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "py7zr>=1.1.3",
    "pyarrow>=23.0.1",
    "pycountry>=24.6.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pytz>=2025.1",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.3",
    "rioxarray>=0.19.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "sdmx1>=2.22.0",
    "shapely>=2.0.7",
    "tailwind-colors>=1.3.0",
    "timezonefinder>=6.5.9",
    "tqdm>=4.67.1",
    "xarray>=2025.1.2",
    "xgboost-cpu>=3.1.2",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
lstm = [
    "torch>=2.0.0",
]

# Install PyTorch from its CPU-only index, which is much smaller than the
# default build with CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "diff-cover>=9.0.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "types-geopandas>=1.1.4.20261006",
    "types-pytz>=2026.5.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "types-shapely>=2.1.0.20260728",
    "types-tqdm>=4.70.0.20260906",
]

[tool.mypy]
files = ["."]
exclude = ["^archive/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["cartopy.*", "cdsapi", "cpi", "nepali_datetime", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Libraries with type hints but without a py.typed marker.
module = ["google.cloud.storage", "google.cloud.storage.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "network: needs network access (deselect with -m 'not network')",
]
# Deprecations are errors, so that upgrades of pandas, NumPy, Dask, xarray
# and other dependencies fail loudly instead of silently changing results.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::FutureWarning",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "archive/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

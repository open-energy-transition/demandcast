title: Global Dataset of Forecasted Hourly Electricity Demand from 2000 to 2025 Using DemandCast

keywords:
  - Global forecasts
  - Electricity demand
  - Hourly resolution
  - Subnational
  - Machine learning

related_identifiers:
  - relation: isDerivedFrom
    identifier: https://github.com/open-energy-transition/demandcast
    resource_type: software
  - relation: isDocumentedBy
    identifier: https://arxiv.org/abs/2510.08000
    resource_type: publication-conferencepaper
  - relation: isDocumentedBy

licence:
  redistribute: false
  terms: Actual total load is not on the list of data that ENTSO-E opens under CC BY 4.0. Its re-use needs the agreement of the TSOs that own it, where it could prejudice their rights.
  url: https://transparencyplatform.zendesk.com/hc/en-us/articles/40921911218961-Legal-Terms-and-Conditions
definition:
  - start_date: 2014-10-19
    quantity: actual total load
    embedded_generation: unknown
    network_losses: included
    storage_charging: excluded
    power_plant_use: unknown
    note: ENTSO-E defines the actual total load as the net generation of the plants on the transmission and distribution networks plus the imports minus the exports and the power absorbed by storage, so with the losses of the networks. Each system operator may use the gross generation instead, with the use of the power plants. Many system operators leave out the solar behind the meters (see the flags).

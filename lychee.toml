# Settings of lychee, which checks the links of the README and of the
# documentation (see .github/workflows/links.yml).

# Answers that a website is rate limited are not broken links.
accept = ["200..=299", "429"]

# Websites that refuse automated requests, or those from the runners of
# GitHub Actions, with HTTP 403: the Data Explorer of the IMF, Ember,
# NASA Earthdata, where the DOIs of SEDAC lead, and the data of the World
# Bank.
exclude = [
  '^https://data\.imf\.org/',
  '^https://ember-energy\.org/',
  '^https://doi\.org/10\.7927/',
  '^https://(www\.)?earthdata\.nasa\.gov/',
  '^https://data\.worldbank\.org/',
]

# GitHub answers 503 to bursts of requests for the pages of its
# repositories: send fewer at once, and retry them later.
max_concurrency = 8
max_retries = 5
retry_wait_time = 10

# Configuration of the documentation site, built with MkDocs and the
# Material theme from the docs folder, by the docs workflow
# (.github/workflows/docs.yml), which deploys it to GitHub Pages.

site_name: DemandCast
theme:
  name: material
  icon:
    logo: octicons/zap-24
    repo: octicons/git-branch-24
  favicon: lightning_logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.integrate

plugins:
  - privacy
  - search

repo_name: open-energy-transition/demandcast
repo_url: https://github.com/open-energy-transition/demandcast

nav:
  - index.md
  - status.md
  - getting_started.md
  - retrieval.md
  - ML.md
  - plot.md
  - publishing.md
  - Dockerfile.md
  - architecture.md

markdown_extensions:
  - toc:
      toc_depth: 3 # Up to h3 will be included in the table of contents
  # Includes the numbers that plot.py writes for the Current state page.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

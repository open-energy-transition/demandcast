# Configuration of the documentation site, built with Zensical from the
# docs folder by the docs workflow (.github/workflows/docs.yml), which
# deploys it to GitHub Pages.

[project]
site_name = "DemandCast"
repo_name = "open-energy-transition/demandcast"
repo_url = "https://github.com/open-energy-transition/demandcast"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Install" = "getting-started/install.md" },
    { "Your first forecast" = "getting-started/first-forecast.md" },
  ] },
  { "Concepts" = [
    { "How DemandCast works" = "concepts/pipeline.md" },
    { "Electricity demand data" = "concepts/electricity-demand.md" },
    { "Quality flags and reviews" = "concepts/flags.md" },
    { "Weather and socio-economic inputs" = "concepts/inputs.md" },
    { "Models" = "concepts/models.md" },
    { "Glossary" = "concepts/glossary.md" },
  ] },
  { "How-to guides" = [
    { "Retrieve data" = "guides/retrieve.md" },
    { "Assemble a dataset" = "guides/assemble.md" },
    { "Train and validate" = "guides/train-validate.md" },
    { "Cross-validate" = "guides/cross-validate.md" },
    { "Forecast" = "guides/forecast.md" },
    { "Plot figures" = "guides/plot.md" },
    { "Run checks" = "guides/check.md" },
    { "Share the data folder" = "guides/sync.md" },
    { "Publish a release" = "guides/publish.md" },
    { "Use Docker" = "guides/docker.md" },
  ] },
  { "Reference" = [
    { "Configuration files" = "reference/configuration.md" },
    { "Data sources" = "reference/data-sources.md" },
    { "Data folder" = "reference/data-folder.md" },
    { "Code architecture" = "reference/architecture.md" },
  ] },
  { "Current state" = "status.md" },
  { "FAQ" = "help/faq.md" },
]

[project.theme]
name = "material"
favicon = "lightning_logo.svg"
features = [
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
  "search.suggest",
]

[project.theme.icon]
logo = "octicons/zap-24"
repo = "octicons/git-branch-24"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "green"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "green"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.plugins.privacy]

[project.plugins.search]

# Earlier addresses of moved pages, which published Zenodo records and
# other sites link to.
[project.plugins.redirects.redirect_maps]
"getting_started.md" = "getting-started/first-forecast.md"
"retrieval.md" = "guides/retrieve.md"
"ML.md" = "concepts/models.md"
"plot.md" = "guides/plot.md"
"publishing.md" = "guides/publish.md"
"Dockerfile.md" = "guides/docker.md"
"architecture.md" = "reference/architecture.md"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
toc.permalink = true
toc.toc_depth = 3 # Up to h3 is included in the table of contents
# Includes the numbers that plot.py writes for the Current state page.
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true

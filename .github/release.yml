# Categories of the release notes generated by GitHub. Pull requests are
# labelled from their Conventional Commits title.
changelog:
  categories:
    - title: Breaking changes
      labels:
        - Breaking change
    - title: New features
      labels:
        - Enhancement
    - title: Bug fixes
      labels:
        - Bug
    - title: Documentation
      labels:
        - Documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"

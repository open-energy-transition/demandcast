# Dependabot keeps dependencies up to date: security fixes as soon as an
# advisory is published, and monthly version updates (minor and patch
# grouped, majors separate, after a 7-day cooldown).

version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/demandcast"
      - "/webpage"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "ci"
      include: "scope"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/demandcast"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"

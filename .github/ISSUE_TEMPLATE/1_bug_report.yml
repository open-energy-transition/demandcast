name: Bug report
description: Report an error or unexpected behavior
labels: ["Bug"]
type: Bug

body:
  - type: markdown
    attributes:
      value: >
        #### Before submitting a bug, please make sure the issue hasn't been already
        addressed by searching through [the past issues](https://github.com/open-energy-transition/demandcast/issues).

  - type: textarea
    attributes:
      label: Summary
      description: |
        A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        Please provide detailed steps to reproduce the bug, including the script and configuration you used.
        If we cannot reproduce the bug, it is unlikely that we will be able to help you.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Error message or logs
      description: Paste the full error message or the relevant log output.
      render: text
    validations:
      required: false

  - type: input
    attributes:
      label: Version
      description: What commit/version are you using?
      placeholder: e.g., v1.0.0 or commit 19b44ee
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Environment
      description: How do you run DemandCast?
      options:
        - Locally with uv
        - Docker image
        - Other
    validations:
      required: true

  - type: input
    attributes:
      label: Operating system and Python version
      placeholder: e.g., Ubuntu 24.04, Python 3.12
    validations:
      required: false

# Runs the pre-commit hooks and the tests on pull requests and on pushes to
# main.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    timeout-minutes: 10
    name: "pre-commit"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  pytest:
    timeout-minutes: 10
    name: "pytest+coverage"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: "Install uv"
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: "Run pytest with coverage report"
        run: uv run --extra lstm pytest --cov=utils --cov-report=term-missing --cov-fail-under=95
        working-directory: ./demandcast

  # Single check for the branch ruleset to require, so that CI jobs can be
  # added or renamed without changing the ruleset.
  ci-result:
    name: "CI result"
    if: always()
    needs: [pre-commit, pytest]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check that all CI jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'all(. == "success")' <<< "$RESULTS"

# Runs the pre-commit hooks, the tests, mypy and a Docker build on pull
# requests and on pushes to main. Pull requests that only change
# documentation skip the tests, mypy and the Docker build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Labels can skip the check of the changed lines, so re-run on changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Detects pull requests that only change documentation, so that the
  # tests, mypy and the Docker build can be skipped for them.
  changes:
    name: "Changed files"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - name: Check whether only documentation changed
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("docs-only", "false");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const isDocs = (path) =>
              /^(webpage\/|\.github\/ISSUE_TEMPLATE\/)/.test(path) ||
              /^(\.github\/PULL_REQUEST_TEMPLATE\.md|CITATION\.cff|LICENSE)$/.test(path) ||
              (path.endsWith(".md") && !path.startsWith(".github/workflows/"));
            const docsOnly =
              files.length > 0 &&
              files.every(
                (file) =>
                  isDocs(file.filename) &&
                  (!file.previous_filename || isDocs(file.previous_filename)),
              );
            core.info(`Documentation-only change: ${docsOnly}`);
            core.setOutput("docs-only", String(docsOnly));

  pre-commit:
    timeout-minutes: 15
    name: "pre-commit"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: "Cache the hook environments"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The mypy job checks the types with the project's dependencies.
      - name: "Run the hooks"
        env:
          SKIP: mypy
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

  tests:
    name: "tests (${{ matrix.os }}, Python ${{ matrix.python }})"
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage: true
          - os: ubuntu-latest
            python: "3.14"
            coverage: false
          - os: windows-latest
            python: "3.12"
            coverage: false
    defaults:
      run:
        working-directory: ./demandcast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # diff-cover compares pull requests with main.

      - name: "Install uv and Python"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          cache-dependency-glob: demandcast/uv.lock

      - name: "Run the tests"
        if: ${{ !matrix.coverage }}
        run: uv run --locked --extra lstm pytest

      - name: "Run the tests with coverage"
        if: ${{ matrix.coverage }}
        run: uv run --locked --extra lstm pytest --cov --cov-report=xml

      # Raise the floor of the total coverage as tests are added.
      - name: "Check the coverage"
        if: ${{ matrix.coverage }}
        run: |
          uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          uv run --locked coverage report --fail-under=54
          uv run --locked coverage report --include="utils/*" --fail-under=95

      # Maintainers can skip this check for mechanical changes, such as
      # renames or lint fixes in untested code, with a label.
      - name: "Check the coverage of the changed lines"
        if: ${{ matrix.coverage && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-diff-cover') }}
        run: |
          uv run --locked diff-cover coverage.xml --compare-branch=origin/main --fail-under=80 --format markdown:diff-cover.md || status=$?
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

  mypy:
    name: "mypy"
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./demandcast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv and Python"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-dependency-glob: demandcast/uv.lock

      - name: "Check the types"
        run: uv run --locked --extra lstm mypy

  docker-image:
    name: "Docker image"
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./demandcast
          load: true
          tags: demandcast:test
          cache-from: type=gha,scope=demandcast
          cache-to: type=gha,mode=max,scope=demandcast

      - name: Check that the image runs as an unprivileged user
        run: |
          test "$(docker run --rm demandcast:test id -u)" = 1000
          docker run --rm demandcast:test uv run retrieve.py --help

      - name: Check that the image contains the input files of the retrievals
        run: |
          docker run --rm demandcast:test test -f \
            retrievals/socio_economic_data_sources/manual_downloads/IAM_national_population.csv

      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: demandcast:test
          fail-build: false
          only-fixed: true
          output-format: table

  # Single check for the branch ruleset to require, so that CI jobs can be
  # added or renamed without changing the ruleset. Jobs skipped for
  # documentation-only changes count as successful.
  ci-result:
    name: "CI result"
    if: always()
    needs: [changes, pre-commit, tests, mypy, docker-image]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check that all CI jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'all(. == "success" or . == "skipped")' <<< "$RESULTS"

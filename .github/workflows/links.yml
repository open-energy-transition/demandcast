# Checks the links of the README, of the other guides of the repository and
# of the documentation every week, and on pull requests that change them,
# with lychee and its settings in lychee.toml. A broken link fails the
# check. Lychee is a release of its program, checked against its SHA-256:
# to update it, change its version and checksum, from the assets of the
# release on https://github.com/lycheeverse/lychee/releases.

name: Links

on:
  schedule:
    - cron: "41 5 * * 1"
  pull_request:
    paths:
      - "**.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  check:
    name: "Check the links"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        env:
          VERSION: "0.24.2"
          SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${VERSION}/${archive}"
          echo "${SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/lychee-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"

      - name: Check the links
        env:
          # The token avoids the rate limit of GitHub for its own links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          lychee --no-progress
          README.md
          CONTRIBUTING.md
          AGENTS.md
          CODE_OF_CONDUCT.md
          'webpage/docs/**/*.md'
